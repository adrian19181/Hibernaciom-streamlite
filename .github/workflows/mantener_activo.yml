name: Despertador Automatico Streamlit

on:
  schedule:
    # Se ejecuta cada 2 horas en el minuto 17 para evitar la congestión de GitHub Actions
    - cron: '17 */2 * * *'
  workflow_dispatch:

jobs:
  wake-streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Playwright y dependencias
        run: |
          pip install playwright
          playwright install chromium

      - name: Ejecutar navegador automatizado
        run: python keep_alive.py